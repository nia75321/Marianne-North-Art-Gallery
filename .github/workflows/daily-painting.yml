name: Daily Painting

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  COS_HOST: "marianne-north-art-1474440715.cos.ap-shanghai.myqcloud.com"

jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest main
        run: |
          git fetch origin
          git reset --hard origin/main

      - name: Run daily painting bot
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: python3 tools/daily_painting.py

      - name: Install COSCMD
        run: python3 -m pip install --user coscmd

      - name: Upload gallery to Tencent COS
        env:
          SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
        run: |
          test -n "$SECRET_ID" && test -n "$SECRET_KEY"
          test -n "$COS_BUCKET" && test -n "$COS_REGION"
          python3 -m coscmd config -a "$SECRET_ID" -s "$SECRET_KEY" -r "$COS_REGION" -b "$COS_BUCKET"
          for file in output/*; do
            python3 -m coscmd upload "$file" "/$(basename "$file")"
          done

      - name: Commit and push archive to GitHub
        run: |
          git config user.name "daily-painting-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if ! git diff --quiet HEAD -- output/; then
            git commit -m "Daily painting $(date -u +%F)"
          fi
          git fetch origin
          git rebase -X theirs origin/main
          git push origin main
