name: Daily Painting

on:
  schedule:
    # 每天 UTC 00:10 运行 = 北京时间 08:10
    - cron: "10 0 * * *"
  # 也可以在 GitHub 仓库 Actions 页面手动点击 "Run workflow" 立即换画
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show run context
        run: |
          echo "Commit:   $(git rev-parse --short HEAD)"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Date:     $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Run daily painting bot
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: python3 tools/daily_painting.py

      - name: Commit and push to GitHub
        run: |
          git config user.name "daily-painting-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --quiet HEAD -- output/; then
            echo "No new painting, nothing to commit."
          else
            git commit -m "Daily painting $(date -u +%F)"
            git push
          fi

      - name: Push to Gitee (mirror, 国内访问)
        if: env.GITEE_USERNAME != '' && env.GITEE_TOKEN != ''
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_USERNAME}/Marianne-North-Art-Gallery.git"
          git push gitee "${{ github.ref_name }}"
